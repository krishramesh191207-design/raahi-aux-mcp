services:
  - type: web
    name: raahi-auxiliary-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "10000"
      - key: DEMO_PERSISTENCE
        value: "false"
